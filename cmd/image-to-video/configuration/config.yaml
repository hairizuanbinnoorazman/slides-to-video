server:
  host: 0.0.0.0
  port: 8082
  trace: false
  svcAccFile: "/run/secrets/image_to_video_cred"
  mode: queue
  processRoute: /
  managerHost: manager
  managerPort: 8080
queue:
  type: "nats"
  nats:
    endpoint: "nats://queue:4222"
  imageToVideoTopic: "image-to-video"
blobStorage:
  type: local
  local:
    basePath: "/data/storage"
  imagesFolder: images
  videoSnippetsFolder: video-snippets

