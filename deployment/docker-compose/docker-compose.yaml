version: '3.3'

services:
  frontend:
    image: frontend
    ports:
      - 8081:8080
  manager:
    image: slides-to-video-manager
    ports:
      - 8880:8080
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    secrets:
      - manager_secrets.yaml
    command:
      - "app"
      - "server"
      - "-c"
      - "/run/secrets/manager_secrets.yaml"
    restart: always
  migrate:
    image: slides-to-video-manager
    depends_on:
      db:
        condition: service_healthy
    command:
      - "app"
      - "migrate"
    restart: on-failure
  db:
    image: mysql:5.7
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: some-database
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  s3:
    image: minio/minio:RELEASE.2020-11-19T23-48-16Z
    ports:
      - 9999:9000
    environment:
      MINIO_ACCESS_KEY: s3_user
      MINIO_SECRET_KEY: s3_password
    command:
      - "server"
      - "/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  createbuckets:
    image: minio/mc:RELEASE.2020-11-17T00-39-14Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add minio http://s3:9000 s3_user s3_password;
      /usr/bin/mc rm -r --force minio/videos;
      /usr/bin/mc mb minio/videos;
      /usr/bin/mc policy download minio/videos;
      exit 0;
      "
    restart: on-failure

secrets:
  manager_secrets.yaml:
    file: manager_secrets.yaml

